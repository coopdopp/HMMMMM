<!DOCTYPE html>
<html>
<head>
    <title>Balloons!</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #character {
            width: 400px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* Full-screen flash */
        #flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
        }

        .flash-animation {
            animation: flash 0.7s ease-out;
        }

        @keyframes flash {
            0% {
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            30% {
                opacity: 0.2;
            }

            45% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .show {
            opacity: 1 !important;
        }

        button {
            position: absolute;
            bottom: 30px;
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Image -->
    <img id="character" src="FNAF2BB.webp" alt="Balloons">

    <!-- Flash -->
    <div id="flash"></div>

    <button onclick="scare()">Click Me</button>

    <script>
        function scare() {

            const image = document.getElementById("character");
            const flash = document.getElementById("flash");

            // Hide image
            image.classList.remove("show");

            // Restart flash animation
            flash.classList.remove("flash-animation");
            void flash.offsetWidth;
            flash.classList.add("flash-animation");

            // Make image appear after the flash
            setTimeout(function() {
                image.classList.add("show");
            }, 450);
        }
    </script>

</body>
</html>
