<!DOCTYPE html>
<html>
<head>
    <title>Balloons!</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #character {
            width: 400px;
            opacity: 0;
            transition: opacity 0.1s;
        }

        #flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
        }

        .flash-animation {
            animation: flash 0.7s ease-out;
        }

        @keyframes flash {
            0% {
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            25% {
                opacity: 0;
            }

            40% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        #button {
            position: fixed;
            bottom: 30px;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>

<body>

    <!-- Your image -->
    <img id="character" src="FNAF2BB.webp" alt="Balloons">

    <!-- Flash effect -->
    <div id="flash"></div>

    <!-- Button -->
    <button id="button" onclick="scare()">Click Me</button>

    <script>
        function scare() {

            const image = document.getElementById("character");
            const flash = document.getElementById("flash");

            // Hide image
            image.style.opacity = "0";

            // Restart the flash animation
            flash.classList.remove("flash-animation");

            // Forces the animation to restart
            void flash.offsetWidth;

            flash.classList.add("flash-animation");

            // Show image after flash
            setTimeout(function() {
                image.style.opacity = "1";
            }, 450);
        }
    </script>

</body>
</html>
