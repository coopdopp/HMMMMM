<!DOCTYPE html>
<html>
<head>
    <title>Balloons!</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #character {
            width: 400px;
            opacity: 0;
            transition: opacity 0.1s;
        }

        #flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
        }

        .flash-animation {
            animation: flash 0.7s ease-out;
        }

        @keyframes flash {
            0% {
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            25% {
                opacity: 0;
            }

            40% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .buttons {
            position: fixed;
            bottom: 30px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Image -->
    <img id="character" src="FNAF2BB.webp" alt="Balloons">

    <!-- Flash -->
    <div id="flash"></div>

    <!-- Audio -->
    <audio id="sound">
        <source src="jumpscare.mp3" type="audio/mpeg">
    </audio>

    <!-- Buttons -->
    <div class="buttons">
        <button onclick="scare()">Click Me</button>
        <button onclick="playAudio()">🔊 Play Audio</button>
    </div>

    <script>

        function scare() {

            const image = document.getElementById("character");
            const flash = document.getElementById("flash");

            // Hide image
            image.style.opacity = "0";

            // Restart flash
            flash.classList.remove("flash-animation");
            void flash.offsetWidth;
            flash.classList.add("flash-animation");

            // Show image
            setTimeout(function() {
                image.style.opacity = "1";
            }, 450);
        }

        function playAudio() {

            const sound = document.getElementById("sound");

            // Restart audio from beginning
            sound.currentTime = 0;

            // Play audio
            sound.play();
        }

    </script>

</body>
</html>
